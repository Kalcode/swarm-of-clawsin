# The "back tomorrow" page: answers every request on swarm-world.4rc4de.com while the tunnel is down.
# Switched on and off by scripts/public-closed.sh (docs/public-viewer.md).
name = "swarm-world-closed"
main = "worker.js"
compatibility_date = "2026-11-01"
# The account comes from CLOUDFLARE_ACCOUNT_ID (the environment, or a line in the gitignored .env that
# scripts/public-closed.sh passes on), so it stays out of the repo.
workers_dev = false
routes = [{ pattern = "swarm-world.4rc4de.com/*", zone_name = "4rc4de.com" }]
